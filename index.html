
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef1f5">
<title>Login</title>

<style>
:root{
  --bg:#eef1f5;
  --card:#fff;
  --ink:#1c2430;
  --mute:#66707f;
  --line:#d5dbe4;
  --acc:#2f5bea;
  --btn:#fff;
  --err:#c62f3b;
  --ok:#1d7a4d
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#12161d;
    --card:#1b212b;
    --ink:#e8ecf2;
    --mute:#9099a8;
    --line:#2d3544;
    --acc:#7b9bff;
    --btn:#0d1220;
    --err:#ff7b86;
    --ok:#5fd39b
  }
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif
}

.card{
  width:100%;
  max-width:380px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:28px 24px
}

h1{
  font-size:22px;
  margin:0 0 4px
}

.sub{
  margin:0 0 8px;
  color:var(--mute);
  font-size:14px
}

label{
  display:block;
  font-size:14px;
  margin:14px 0 6px
}

input{
  width:100%;
  padding:11px 12px;
  font:inherit;
  color:inherit;
  background:transparent;
  border:1px solid var(--line);
  border-radius:8px
}

input:focus-visible,
button:focus-visible{
  outline:2px solid var(--acc);
  outline-offset:2px
}

.main{
  width:100%;
  margin-top:20px;
  padding:12px;
  font:inherit;
  font-weight:600;
  color:var(--btn);
  background:var(--acc);
  border:0;
  border-radius:8px;
  cursor:pointer
}

.main:disabled{
  opacity:.6;
  cursor:wait
}

.link{
  background:none;
  border:0;
  padding:0;
  font:inherit;
  font-size:14px;
  color:var(--acc);
  cursor:pointer;
  text-decoration:underline
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:18px
}

#msg{
  min-height:20px;
  margin:14px 0 0;
  font-size:14px;
  overflow-wrap:anywhere
}

#msg.err{color:var(--err)}
#msg.ok{color:var(--ok)}

details{
  margin-top:20px;
  border-top:1px solid var(--line);
  padding-top:14px
}

summary{
  cursor:pointer;
  font-size:14px
}

.out{
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink)
}

[hidden]{
  display:none!important
}
</style>
</head>

<body>
<div class="card">

  <!-- LOGIN -->
  <form data-view="login" id="fLogin">
    <h1>Masuk</h1>
    <p class="sub">Pakai username atau email.</p>

    <label for="lId">Username atau email</label>
    <input
      id="lId"
      autocomplete="username"
      autocapitalize="none"
      required
    >

    <label for="lPass">Password</label>
    <input
      id="lPass"
      type="password"
      autocomplete="current-password"
      required
    >

    <button class="main">Masuk</button>

    <div class="row">
      <button type="button" class="link" data-go="register">
        Buat akun
      </button>

      <button type="button" class="link" data-go="forgot">
        Lupa password
      </button>
    </div>
  </form>


  <!-- REGISTER -->
  <form data-view="register" id="fReg" hidden>
    <h1>Buat akun</h1>
    <p class="sub">Email dipakai untuk reset password.</p>

    <label for="rUser">Username</label>
    <input
      id="rUser"
      autocomplete="username"
      autocapitalize="none"
      required
    >

    <label for="rMail">Email</label>
    <input
      id="rMail"
      type="email"
      autocomplete="email"
      required
    >

    <label for="rPass">Password (min. 8 karakter)</label>
    <input
      id="rPass"
      type="password"
      autocomplete="new-password"
      minlength="8"
      required
    >

    <button class="main">Buat akun</button>

    <div class="row">
      <button type="button" class="link" data-go="login">
        Sudah punya akun
      </button>
    </div>
  </form>


  <!-- FORGOT PASSWORD -->
  <div data-view="forgot" hidden>
    <h1>Reset password</h1>

    <form id="fForgot">
      <p class="sub">Kode OTP dikirim ke email akunmu.</p>

      <label for="fMail">Email</label>
      <input
        id="fMail"
        type="email"
        autocomplete="email"
        required
      >

      <button class="main">Kirim kode</button>
    </form>

    <form id="fReset" hidden>
      <label for="fOtp">Kode OTP (6 digit)</label>
      <input
        id="fOtp"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        autocomplete="one-time-code"
        required
      >

      <label for="fNew">Password baru</label>
      <input
        id="fNew"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button class="main">Simpan password baru</button>
    </form>

    <div class="row">
      <button type="button" class="link" data-go="login">
        Kembali ke masuk
      </button>
    </div>
  </div>


  <!-- MAIN -->
  <div data-view="main" hidden>
    <h1>Yee, berhasil login!</h1>
    <p class="sub" id="hi"></p>

    <button class="main out" id="bOut">
      Keluar
    </button>

    <details>
      <summary>Ganti password</summary>

      <form id="fChange">
        <label for="cOld">Password lama</label>
        <input
          id="cOld"
          type="password"
          autocomplete="current-password"
          required
        >

        <label for="cNew">Password baru</label>
        <input
          id="cNew"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button class="main">Simpan</button>
      </form>
    </details>
  </div>


  <p id="msg" role="status" aria-live="polite"></p>

  <p class="sub" style="margin:10px 0 0">
    build 6 (index)
  </p>

</div>


<script>
'use strict';

/* =====================================
   CONFIGURATION
===================================== */

// URL Cloudflare Worker.
// GANTI dengan URL Worker setelah dibuat.
const API = 'https://GANTI-DENGAN-URL-WORKER.workers.dev';

// URL GAS tetap dipakai jika HTML dibuka
// langsung dari Google Apps Script.
const GAS_MODE =
  typeof google !== 'undefined' &&
  google.script &&
  google.script.run;


/* =====================================
   ELEMENTS & SESSION
===================================== */

const $ = selector => document.querySelector(selector);

let token = '';

try {
  token = localStorage.getItem('token') || '';
} catch(e) {
  token = '';
}


/* =====================================
   MESSAGE
===================================== */

function msg(text, type = 'err') {
  const el = $('#msg');

  el.textContent = text || '';
  el.className = text ? type : '';
}

function show(view) {
  document.querySelectorAll('[data-view]').forEach(el => {
    el.hidden = el.dataset.view !== view;
  });

  msg('');
}

function showMain(user) {
  if (!user || !user.username) {
    setToken('');
    show('login');
    msg('Data pengguna tidak valid.');
    return;
  }

  $('#hi').textContent = 'Halo, ' + user.username + '.';
  show('main');
}


/* =====================================
   TOKEN
===================================== */

function setToken(value) {
  token = value || '';

  try {
    if (token) {
      localStorage.setItem('token', token);
    } else {
      localStorage.removeItem('token');
    }
  } catch(e) {
    console.warn('Penyimpanan token gagal:', e);
  }
}


/* =====================================
   API - GOOGLE APPS SCRIPT
===================================== */

function callGAS(body) {
  return new Promise(resolve => {

    google.script.run
      .withSuccessHandler(result => {
        resolve(result || {
          ok:false,
          msg:'Respons GAS kosong.'
        });
      })
      .withFailureHandler(error => {
        resolve({
          ok:false,
          msg:'Gagal menghubungi GAS: ' +
            (error.message || error)
        });
      })
      .api(body);

  });
}


/* =====================================
   API - CLOUDFLARE WORKER
===================================== */

async function callWorker(body) {

  if (
    !API ||
    API.includes('GANTI-DENGAN')
  ) {
    return {
      ok:false,
      msg:'URL Cloudflare Worker belum dikonfigurasi.'
    };
  }

  try {

    const response = await fetch(API, {
      method:'POST',

      // Menggunakan request sederhana tanpa
      // Content-Type application/json.
      // Worker akan membaca JSON dari body.
      body:JSON.stringify(body),

      mode:'cors',
      credentials:'omit',
      redirect:'follow'
    });

    const responseText = await response.text();

    if (!response.ok) {
      return {
        ok:false,
        msg:'HTTP Error: ' + response.status
      };
    }

    let result;

    try {
      result = JSON.parse(responseText);
    } catch(e) {
      return {
        ok:false,
        msg:'Respons Worker bukan JSON: ' +
          responseText.slice(0,150)
      };
    }

    if (
      !result ||
      typeof result.ok !== 'boolean'
    ) {
      return {
        ok:false,
        msg:'Format respons API tidak valid.'
      };
    }

    return result;

  } catch(error) {

    return {
      ok:false,
      msg:'Koneksi Worker gagal: ' + error.message
    };

  }
}


/* =====================================
   API ROUTER
===================================== */

async function call(body) {

  if (GAS_MODE) {
    return callGAS(body);
  }

  return callWorker(body);
}


/* =====================================
   FORM HANDLER
===================================== */

function onSubmit(selector, callback) {

  $(selector).addEventListener('submit', async event => {

    event.preventDefault();

    const form = event.target;
    const button = form.querySelector('.main');

    if (button.disabled) return;

    button.disabled = true;

    try {
      await callback();
    } catch(error) {
      console.error(error);
      msg('Terjadi kesalahan: ' + error.message);
    } finally {
      button.disabled = false;
    }

  });

}


/* =====================================
   NAVIGATION
===================================== */

document.querySelectorAll('[data-go]').forEach(button => {

  button.addEventListener('click', () => {

    const destination = button.dataset.go;

    if (destination === 'forgot') {
      $('#fReset').hidden = true;
      $('#fForgot').hidden = false;
    }

    show(destination);

  });

});


/* =====================================
   LOGIN
===================================== */

onSubmit('#fLogin', async () => {

  const identity = $('#lId').value.trim();
  const password = $('#lPass').value;

  const result = await call({
    action:'login',
    identity:identity,
    pass:password
  });

  if (!result.ok) {
    msg(result.msg || 'Gagal masuk.');
    return;
  }

  if (!result.token || !result.user) {
    msg('Respons login tidak lengkap.');
    return;
  }

  setToken(result.token);

  $('#lPass').value = '';

  showMain(result.user);

});


/* =====================================
   REGISTER
===================================== */

onSubmit('#fReg', async () => {

  const username = $('#rUser').value.trim();
  const email = $('#rMail').value.trim();
  const password = $('#rPass').value;

  const result = await call({
    action:'register',
    username:username,
    email:email,
    pass:password
  });

  if (!result.ok) {
    msg(result.msg || 'Gagal membuat akun.');
    return;
  }

  $('#lId').value = username;
  $('#rPass').value = '';

  $('#fReg').reset();

  show('login');

  msg(
    result.msg || 'Akun berhasil dibuat. Silakan masuk.',
    'ok'
  );

});


/* =====================================
   FORGOT PASSWORD
===================================== */

onSubmit('#fForgot', async () => {

  const email = $('#fMail').value.trim();

  const result = await call({
    action:'forgot',
    email:email
  });

  if (!result.ok) {
    msg(result.msg || 'Gagal mengirim kode OTP.');
    return;
  }

  $('#fReset').hidden = false;

  msg(
    result.msg || 'Kode OTP berhasil dikirim.',
    'ok'
  );

});


/* =====================================
   RESET PASSWORD
===================================== */

onSubmit('#fReset', async () => {

  const email = $('#fMail').value.trim();
  const otp = $('#fOtp').value.trim();
  const newPass = $('#fNew').value;

  const result = await call({
    action:'reset',
    email:email,
    otp:otp,
    newPass:newPass
  });

  if (!result.ok) {
    msg(result.msg || 'Gagal reset password.');
    return;
  }

  $('#fOtp').value = '';
  $('#fNew').value = '';

  $('#fReset').hidden = true;

  show('login');

  msg(
    result.msg || 'Password berhasil direset.',
    'ok'
  );

});


/* =====================================
   CHANGE PASSWORD
===================================== */

onSubmit('#fChange', async () => {

  if (!token) {
    msg('Sesi tidak ditemukan. Silakan login kembali.');
    return;
  }

  const result = await call({
    action:'changePassword',
    token:token,
    oldPass:$('#cOld').value,
    newPass:$('#cNew').value
  });

  if (!result.ok) {
    msg(result.msg || 'Gagal mengganti password.');
    return;
  }

  if (result.token) {
    setToken(result.token);
  }

  $('#cOld').value = '';
  $('#cNew').value = '';

  msg(
    'Password berhasil diganti.',
    'ok'
  );

});


/* =====================================
   LOGOUT
===================================== */

$('#bOut').addEventListener('click', async () => {

  const button = $('#bOut');

  if (button.disabled) return;

  button.disabled = true;

  try {

    if (token) {
      const result = await call({
        action:'logout',
        token:token
      });

      if (!result.ok) {
        console.warn('Logout server:', result.msg);
      }
    }

    setToken('');

    $('#fLogin').reset();

    show('login');

    msg('Kamu sudah keluar.', 'ok');

  } catch(error) {

    msg('Logout gagal: ' + error.message);

  } finally {

    button.disabled = false;

  }

});


/* =====================================
   SESSION VALIDATION
===================================== */

(async function init() {

  if (!token) {
    show('login');
    return;
  }

  show('login');
  msg('Memeriksa sesi...', 'ok');

  const result = await call({
    action:'validate',
    token:token
  });

  if (result.ok && result.user) {

    showMain(result.user);

  } else {

    setToken('');

    show('login');

    msg(
      'Sesi berakhir. Silakan login kembali.',
      'err'
    );

  }

})();


/* =====================================
   GLOBAL ERROR HANDLER
===================================== */

window.addEventListener('error', event => {

  console.error(event.error || event.message);

  msg('Error halaman: ' + event.message);

});

window.addEventListener('unhandledrejection', event => {

  console.error('Promise error:', event.reason);

  msg('Terjadi kesalahan koneksi atau sistem.');

});

</script>
</body>
</html>
